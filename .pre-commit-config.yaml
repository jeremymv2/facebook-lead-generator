minimum_pre_commit_version: "4.6.0"
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # v8.30.1
    hooks:
      - id: gitleaks
        name: Detect secrets in staged changes
        stages: [pre-commit]
      - id: gitleaks
        name: Detect secrets in complete history before push
        entry: gitleaks git --redact --verbose --log-opts=--all
        pass_filenames: false
        stages: [pre-push]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: detect-private-key
        stages: [pre-commit, pre-push]
      - id: check-added-large-files
        args: [--maxkb=1024]
        stages: [pre-commit, pre-push]
      - id: check-toml
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: no-commit-to-branch
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: sensitive-paths
        name: Reject sensitive runtime and credential paths
        entry: python scripts/check_sensitive_paths.py
        language: python
        stages: [pre-commit, pre-push]
